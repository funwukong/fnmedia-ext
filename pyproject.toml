[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fnmedia-ext"
version = "0.2.42"
description = "飞牛影视（fnOS trim.media）在线资源扩展：可逆接管插件"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.162.2",
    "uvicorn==0.54.0",
    "httpx==0.28.1",
    "wasmtime==49.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["proxy"]

[tool.setuptools]
py-modules = []
